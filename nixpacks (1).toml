[phases.setup]
nixPkgs = ["php82", "php82Extensions.pcntl", "php82Extensions.posix", "php82Packages.composer", "nodejs_20", "cacert"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install"
]

[phases.build]
cmds = [
  "npm run build",
  "php artisan octane:install --server=frankenphp --no-interaction"
]

[start]
cmd = "php artisan migrate --force && (php artisan storage:link || true) && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=$PORT"